kind = "web"
previewPath = "/"
title = "Sushi Sayacı"
version = "1.0.0"
id = "artifacts/sushi-counter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21213

[services.development]
run = "pnpm --filter @workspace/sushi-counter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sushi-counter", "run", "build" ]
publicDir = "artifacts/sushi-counter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21213"
BASE_PATH = "/"
